server {
    listen 80;
    server_name contabo.yousuf.life;

    location / {
        proxy_pass https://authentication-basic-chest-underground.trycloudflare.com;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name authentication-basic-chest-underground.trycloudflare.com;

        proxy_set_header Host authentication-basic-chest-underground.trycloudflare.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
